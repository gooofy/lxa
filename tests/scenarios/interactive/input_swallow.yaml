# Phase 251: an input handler in front of Intuition swallows the first click;
# Intuition must only see the second one.  stdout must match on both systems.
name: interactive-input_swallow
app:
  sample: Tests/Devices/InputSwallow
steps:
  - launch
  - wait_output: "Ready"
  - click: {anchor: inside, xy: [60, 30]}
  - frames: 10
  - click: {anchor: inside, xy: [80, 40]}
  - frames: 50
  - snapshot: {name: end, screen: false}
