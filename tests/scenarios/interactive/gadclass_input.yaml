# Phase 252: the Workbench 3.1 gadget classes colorwheel, gradientslider and
# tapedeck driven with the mouse (Intuition's custom-gadget input protocol).
# stdout must match on both systems.
name: interactive-gadclass_input
app:
  sample: Tests/Intuition/GadClassInput
steps:
  - launch
  - wait_output: "Ready"
  - wait_idle
  - snapshot: {name: start, window: GadClass}
  - click: {window: GadClass, xy: [80, 40]}
  - frames: 5
  - click: {window: GadClass, xy: [60, 60]}
  - frames: 5
  - click: {window: GadClass, xy: [30, 60]}
  - frames: 5
  - click: {window: GadClass, xy: [60, 30]}
  - frames: 5
