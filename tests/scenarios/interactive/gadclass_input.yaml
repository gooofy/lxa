  - frames: 5
  - click: {window: GadClass, xy: [60, 95]}
  - frames: 5
  - click: {window: GadClass, xy: [25, 30]}
  - frames: 5
  - press: {window: GadClass, xy: [100, 116]}
  - move: {window: GadClass, xy: [130, 116]}
  - move: {window: GadClass, xy: [150, 116]}
  - release: {window: GadClass, xy: [150, 116]}
  - frames: 5
  - click: {window: GadClass, xy: [40, 116]}
  - frames: 5
  - click: {window: GadClass, xy: [125, 47]}
  - frames: 5
