# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of Oberon from it.  Window title from the discovery twin run.
name: app-oberon
app: {manifest: Oberon}
steps:
  - launch
  - wait_window: {title: "col: 1", timeout: 30000}
  - wait_idle: {timeout: 20000}
  - frames: 100
  - snapshot: startup
  - quit
