# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of GadToolsBox3 from it.  Window title from the discovery twin run.
name: app-gadtoolsbox3
app: {manifest: GadToolsBox3}
steps:
  - launch
  - wait_window: {title: "Select Screen Mode", timeout: 30000}
  - frames: 100
  - snapshot: startup
  - quit
