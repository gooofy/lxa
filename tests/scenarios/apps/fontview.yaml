# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of FontView from it.  Window title from the discovery twin run.
name: app-fontview
app: {manifest: FontView}
steps:
  - launch
  - wait_window: {title: "FontView", timeout: 30000}
  - wait_idle: {timeout: 20000}
  - frames: 100
  - snapshot: startup
  - quit
