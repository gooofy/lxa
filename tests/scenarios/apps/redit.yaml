# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of ReDit from it.  Window title from the discovery twin run.
name: app-redit
app: {manifest: ReDit}
steps:
  - launch
  - wait_window: {title: "new file", timeout: 30000}
  - wait_idle: {timeout: 20000}
  - frames: 100
  - snapshot: startup
  - quit
