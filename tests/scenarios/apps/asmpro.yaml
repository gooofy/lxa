# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of ASMPro from it.  Window title from the discovery twin run.
name: app-asmpro
app: {manifest: ASMPro}
steps:
  - launch
  - wait_window: {title: "Please select prefered screenmode", timeout: 30000}
  - wait_idle: {timeout: 20000}
  - frames: 100
  - snapshot: startup
  - quit
