# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of ACE from it.  Window title from the discovery twin run.
name: app-ace
app: {manifest: ACE}
steps:
  - launch
  - wait_window: {title: "AIDE Alert Request", timeout: 30000}
  - wait_idle: {timeout: 20000}
  - frames: 100
  - snapshot: startup
  - quit
