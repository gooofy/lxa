# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of MaxonCPP from it.  Window title from the discovery twin run.
name: app-maxoncpp
app: {manifest: MaxonCPP}
steps:
  - launch
  - wait_window: {title: "MaxonDev", timeout: 30000}
  - frames: 100
  - snapshot: startup
  - quit
