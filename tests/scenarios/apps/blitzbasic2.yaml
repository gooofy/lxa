# Phase 230 launch scenario: the compat DB (apps/compat.yaml) derives the
# rating of BlitzBasic2 from it.  Window title from the discovery twin run.
name: app-blitzbasic2
app: {manifest: BlitzBasic2}
steps:
  - launch
  - frames: 150
  - wait_idle: {timeout: 20000}
  - frames: 100
  - snapshot: startup
  - quit
