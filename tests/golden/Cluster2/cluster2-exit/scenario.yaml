# Phase 234 (legacy 162): Cluster2's custom-rendered EXIT toolbar button
# (no Intuition gadgets, WFLG_RMBTRAP, AGENTS.md 6.12) at screen (607,249),
# the click of cluster2_gtest.cpp ExitButtonResponds.
name: cluster2-exit
app: {manifest: Cluster2}
# The editor blinks its text cursor (8x2 at 0,18), and when the blink
# phase is reached differs between the systems: the startup snapshot is
# taken once the cursor has been on for 5 frames (Phase 237d).
steps:
  - launch
  - wait_window: {title: "*", timeout: 20000}
  - frames: 100
  - wait_pixel: {xy: [2, 18], pen: 0}
  - snapshot: {name: startup, when_pixel: {xy: [2, 18], pen: 1, hold: 5}}
  - click: {xy: [607, 249]}
  - frames: 100
  - snapshot: {name: exit, screen: false}   # the editor has quit: no screen of its own is left (lxa opens no Workbench screen by itself)
  - quit
