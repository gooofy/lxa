# Phase 220: test programs that cannot run unattended on the AmigaOS 3.1
# reference (`python3 -m rdd suite-ref`).  Exactly one of
#   interactive: <why>   needs host-side input injection (a GTest driver);
#                        `phase` owns re-expressing it as a reference scenario
#   lxa_only: <why>      depends on lxa-only behaviour (justify it)
# `python3 -m rdd suite-ref --lint` checks this file.

Tests/Console/con_handler:      {interactive: "reads keys injected by console_gtest", phase: 224}
Tests/Console/input_console:    {interactive: "reads keys injected by console_gtest", phase: 224}
Tests/Console/input_inject:     {interactive: "waits for RAWKEY events injected by console_gtest", phase: 224}
Tests/Console/kp2_test:         {interactive: "reads keys injected by console_gtest", phase: 224}
Tests/Console/raw_events_unit:  {interactive: "waits for special-key reports injected by console_gtest", phase: 224}
Tests/Console/setmode:          {interactive: "reads RAW input injected by console_gtest", phase: 224}
Tests/Devices/Keyboard:         {interactive: "waits for a SHIFT key press injected by devices_gtest", phase: 224}
Tests/Intuition/IDCMPDeltaMove: {interactive: "waits for mouse moves injected by intuition_gtest", phase: 224}
Tests/Intuition/IDCMPMenuVerify: {interactive: "waits for an RMB press injected by intuition_gtest", phase: 224}
Tests/Intuition/IDCMPSizeVerify: {interactive: "waits for a sizing-gadget drag injected by intuition_gtest", phase: 224}
Tests/Intuition/RequesterBasic: {interactive: "waits for requester clicks injected by intuition_gtest", phase: 224}
Tests/Devices/ParallelLoopback: {lxa_only: "I/O through lxa's emulated loopback peer on the parallel port; the reference port has nothing connected, so CMD_WRITE never completes (peer-independent semantics: Tests/Devices/Parallel)"}
Tests/Devices/PrinterPeer: {lxa_only: "output to lxa's emulated always-online printer; the reference has no printer at its port, so output never completes there (printer-independent semantics: Tests/Devices/Printer)"}
Tests/Devices/Narrator: {lxa_only: "narrator.device is not part of AmigaOS 3.1 (dropped after 2.0, OpenDevice fails on the reference); lxa ships a replacement for 1.x/2.0 software"}
Tests/Devices/Serial: {lxa_only: "the reference agent (lxaprobe) owns serial.device unit 0 as its control channel, so the test cannot open it there; I/O goes through lxa's loopback peer"}
Tests/Devices/Scsi: {lxa_only: "lxa's scsi.device emulates in-memory disks on its units; the reference A4000 has no IDE/SCSI drive attached, so every unit fails to open there"}
Tests/Devices/Trackdisk: {lxa_only: "needs disks in DF0:/DF1: (host ADF images set up by devices_gtest); the reference floppy drives are empty"}
Tests/Console/keymap_unit: {interactive: "reads a key remapped by CD_SETKEYMAP, injected by console_gtest", phase: 224}
Tests/Console/scrollback_unit: {lxa_only: "tests lxa's CD_SETUPSCROLLBACK/CD_SETSCROLLBACKPOSITION, V47 (AmigaOS 3.2) console commands; the 3.1 console.device answers IOERR_NOCMD"}
