# Phase 220: test programs that cannot run unattended on the AmigaOS 3.1
# reference (`python3 -m rdd suite-ref`).  Exactly one of
#   interactive: <why>   needs host-side input injection (a GTest driver);
#                        `phase` owns re-expressing it as a reference scenario
#   lxa_only: <why>      depends on lxa-only behaviour (justify it)
# `python3 -m rdd suite-ref --lint` checks this file.

Tests/Console/con_handler:      {interactive: "reads keys injected by console_gtest", phase: 224}
Tests/Console/input_console:    {interactive: "reads keys injected by console_gtest", phase: 224}
Tests/Console/input_inject:     {interactive: "waits for RAWKEY events injected by console_gtest", phase: 224}
Tests/Console/kp2_test:         {interactive: "reads keys injected by console_gtest", phase: 224}
Tests/Console/raw_events_unit:  {interactive: "waits for special-key reports injected by console_gtest", phase: 224}
Tests/Console/setmode:          {interactive: "reads RAW input injected by console_gtest", phase: 224}
Tests/Devices/Keyboard:         {interactive: "waits for a SHIFT key press injected by devices_gtest", phase: 224}
Tests/Intuition/DisplayAlert:   {interactive: "DisplayAlert() blocks until the user clicks a mouse button", phase: 224}
Tests/Intuition/IDCMPDeltaMove: {interactive: "waits for mouse moves injected by intuition_gtest", phase: 224}
Tests/Intuition/IDCMPMenuVerify: {interactive: "waits for an RMB press injected by intuition_gtest", phase: 224}
Tests/Intuition/IDCMPSizeVerify: {interactive: "waits for a sizing-gadget drag injected by intuition_gtest", phase: 224}
Tests/Intuition/RequesterBasic: {interactive: "waits for requester clicks injected by intuition_gtest", phase: 224}
Tests/Dos/CliInitNewcli:        {lxa_only: "feeds CliInitNewcli() a hand-built startup packet; dos.doc leaves the packet format undefined (private to the system's shell start-up), lxa uses the AROS layout and AmigaOS 3.1 hangs on it"}
Tests/Dos/CliInitRun:           {lxa_only: "feeds CliInitRun() hand-built Run packets; dos.doc leaves the packet format undefined (private to Run/System start-up), lxa uses the AROS layout which AmigaOS 3.1 does not accept"}
Tests/Dos/SoftLink:             {lxa_only: "soft links need the Fast File System; the reference has only ram-handler (MakeLink LINK_SOFT -> ERROR_NOT_IMPLEMENTED) and the emulator directory filesystem on SYS: (no soft links)"}
Tests/Intuition/InvalidArgs:    {lxa_only: "invalid OpenWindow/OpenScreen arguments (negative WA_Height hangs AmigaOS 3.1, a bogus NW_EXTENDED pointer is dereferenced); checks lxa's sanitizing"}
Tests/Icon/IconV44:             {lxa_only: "icon.library V44 API (IconControlA, LayoutIconA, DrawIconStateA, GetIconRectangleA, ChangeToSelectedIconColor); the AmigaOS 3.1 reference has icon.library V40 without these vectors"}
Tests/Workbench/AppObjectsV44:  {lxa_only: "workbench.library V44 API (OpenWorkbenchObjectA, WorkbenchControlA, drop zones, ...); the AmigaOS 3.1 reference has workbench.library V40 without these vectors (calling them hangs it), its WBInfo() blocks in a modal requester, and stale-handle tolerance is lxa-only"}
Tests/Exec/DisklibStubs:        {lxa_only: "checks the third-party libraries (req, reqtools, powerpacker, arp) lxa ships in System/Libs; a Workbench 3.1 install has none of them"}
Tests/Exec/StubProbe:           {lxa_only: "exercises lxa's stub telemetry (Phase 203): its output names the lxa functions that are still stubs"}
Tests/Exec/NullSafety:          {lxa_only: "lxa's tolerance of NULL semaphores, Cause(NULL), CloseLibrary(NULL) and ParseDate(NULL date); real AmigaOS 3.1 crashes or hangs on these inputs"}
Tests/Exec/MathIeeeSingBasMulDiv: {lxa_only: "IEEESPMul/IEEESPDiv never return on the FS-UAE A4000/040 reference (reported, suspected emulator FPU issue); everything else is in the reference-validated MathIeeeSingBas"}
Tests/Expansion/BoardConfig:    {lxa_only: "boot-time AutoConfig (AllocExpansionMem/ConfigBoard/ConfigChain with absolute slots): results depend on the machine's Zorro boards, ConfigBoard writes the live AutoConfig space and AllocExpansionMem(0) hangs AmigaOS 3.1"}
Tests/Exec/LibraryLxa:          {lxa_only: "sections of Tests/Exec/Library that re-initialise the calling CLI, need lxa's filesystems/resident list, or test hardware (sprites, copper, floppy, SCSI, parallel, gameport) and lxa fixtures; the reference-valid sections are in Tests/Exec/Library"}
